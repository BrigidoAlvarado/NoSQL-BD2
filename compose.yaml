name: admisiones-usac

services:
  mongodb:
    image: ${MONGODB_IMAGE:-mongo:8.0}
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:?Define MONGODB_USERNAME en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:?Define MONGODB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - databases
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1 --port 27017
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'if (db.adminCommand({ ping: 1 }).ok !== 1) quit(1)'
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26-community}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Define NEO4J_PASSWORD en .env}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - databases
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell --address bolt://localhost:7687
          --username neo4j --password "$${NEO4J_AUTH#*/}"
          'RETURN 1 AS disponible;' >/dev/null
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 45s

networks:
  databases:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
  neo4j_data:
  neo4j_logs:
