spring:
  application:
    name: API-Admisiones-USAC
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  mongodb:
    host: ${MONGODB_HOST:127.0.0.1}
    port: ${MONGODB_PORT:27017}
    database: ${MONGODB_DATABASE:admisiones_usac}
    authentication-database: ${MONGODB_AUTH_DATABASE:admin}
    username: ${MONGODB_USERNAME}
    password: ${MONGODB_PASSWORD}
  neo4j:
    uri: ${NEO4J_URI:bolt://${NEO4J_HOST:127.0.0.1}:${NEO4J_BOLT_PORT:7687}}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD}
    connection-timeout: 5s
    max-transaction-retry-time: 5s
    pool:
      connection-acquisition-timeout: 5s
  data:
    neo4j:
      database: ${NEO4J_DATABASE:neo4j}
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 100MB
